# Barman Configuration for PostgreSQL Cluster
[barman]
barman_user = barman
barman_home = /var/lib/barman
log_file = /var/log/barman/barman.log
compression = gzip

[pg_cluster_primary]
description = "EDB Postgres Advanced Server - Primary Cluster"
conninfo = host=10.0.12.45 user=barman password=BarmanSecretStorageToken2026 dbname=postgres
backup_options = concurrent_backup
streaming_conninfo = host=10.0.12.45 user=streaming_barman password=StreamingBarmanSecret! dbname=postgres
ssh_command = ssh -q -i /var/lib/barman/.ssh/id_rsa barman@10.0.12.45
