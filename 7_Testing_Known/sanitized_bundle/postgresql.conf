# --------------------------------------------------
# PostgreSQL Configuration File (Mock EDB Lasso Collector)
# --------------------------------------------------

listen_addresses = '*'
port = 5432
max_connections = 200
shared_buffers = 4GB
work_mem = 64MB
maintenance_work_mem = 512MB
wal_level = replica
max_wal_size = 16GB
min_wal_size = 1GB

# Replication primary connection information
primary_conninfo = 'host=PSEUDO_IP_NODE_01 port=5432 user=repuser password=[REDACTED_PASSWORD] sslmode=require'
primary_slot_name = 'standby_node_2_slot'

# Archive and backup command
archive_mode = on
archive_command = 'barman-wal-archive --user barman --password=[REDACTED_PASSWORD] PSEUDO_IP_NODE_03 %p'

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_line_prefix = '%m [%p] %q%u@%d '

# Connection URI for diagnostic exporter
diagnostic_exporter_uri = "postgres://monitoring_admin:[REDACTED_PASSWORD]@PSEUDO_IP_NODE_06:5432/postgres"
