# Barman Configuration for PostgreSQL Cluster
[barman]
barman_user = barman
barman_home = /var/lib/barman
log_file = /var/log/barman/barman.log
compression = gzip

[pg_cluster_primary]
description = "EDB Postgres Advanced Server - Primary Cluster"
conninfo = host=PSEUDO_IP_NODE_01 user=barman password=[REDACTED_PASSWORD] dbname=postgres
backup_options = concurrent_backup
streaming_conninfo = host=PSEUDO_IP_NODE_01 user=streaming_barman password=[REDACTED_PASSWORD] dbname=postgres
ssh_command = ssh -q -i /var/lib/barman/.ssh/id_rsa barman@PSEUDO_IP_NODE_01
